ShortDescription: AI coding session security scanner with built-in session search
Description: |-
  Skarn scans the sessions your AI coding assistants leave on disk for leaked
  credentials and for the attack patterns that cause or exploit them, across
  Claude Code, Codex CLI, Cursor, Copilot, Gemini CLI, Kimi Code CLI, and Grok
  Build. The same engine also searches, browses, and analyzes those sessions, so
  the tool you audit with is the tool you use daily.

  One self-contained executable with no runtime dependencies. Sessions are read
  and scanned on the machine they live on, and nothing leaves it by default:
  the only network calls Skarn ever makes are the ones you type.

  Findings carry a MITRE ATLAS, OWASP LLM Top 10, and CWE crosswalk, a session
  risk score for CI gating, and SARIF or NDJSON output for a code-scanning or
  SIEM pipeline. Secrets are masked in every output format. A real-time guard
  hook can inspect an agent's tool calls before they run.
