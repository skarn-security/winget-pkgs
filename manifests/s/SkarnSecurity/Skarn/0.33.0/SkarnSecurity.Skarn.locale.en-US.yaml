InstallationNotes: |-
  Run `skarn assess` for a first scan of this machine. `skarn check` needs a
  license: register at https://getskarn.com/free, then install it with
  `skarn license <path>`. `skarn setup` wires the real-time guard into the AI
  coding agents it finds, and `skarn doctor` verifies the wiring.
